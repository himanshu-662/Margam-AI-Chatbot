app = "margam-chatbot"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"
  builder = "docker"

[env]
  PORT = "8000"
  WORKERS = "1"
  LOG_LEVEL = "INFO"
  ENVIRONMENT = "production"

[http_service]
  auto_start_machines = true
  auto_stop_machines = false
  force_https = true
  internal_port = 8000
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "60s"
    method = "GET"
    path = "/health"
    protocol = "http"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
