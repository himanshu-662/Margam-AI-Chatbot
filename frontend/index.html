<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Margam AI | Study Abroad Intelligence Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/index.css">
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #090E17;
      color: #F1F5F9;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      letter-spacing: -0.011em;
      margin: 0;
      padding: 0;
    }

    code, pre, .font-mono {
      font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .serif {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      letter-spacing: -0.025em;
    }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }

    @keyframes slideUpFade {
      0% {
        transform: translateY(8px);
      }
      100% {
        transform: translateY(0);
      }
    }
    .animate-stage {
      opacity: 1;
      animation: slideUpFade 0.25s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes auroraGlow {
      0%, 100% {
        transform: translate(0px, 0px) scale(1);
        opacity: 0.45;
      }
      33% {
        transform: translate(30px, -20px) scale(1.08);
        opacity: 0.65;
      }
      66% {
        transform: translate(-20px, 25px) scale(0.95);
        opacity: 0.4;
      }
    }
    .animate-aurora {
      animation: auroraGlow 14s ease-in-out infinite alternate;
    }

    .bg-ambient-dots {
      background-image: radial-gradient(#1E293B 0.9px, transparent 0.9px);
      background-size: 20px 20px;
    }

    .prose p { margin-bottom: 1rem; line-height: 1.72; font-size: 0.95rem; }
    .prose strong { font-weight: 700; }
    
    .prose table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      margin-top: 1.25rem;
      margin-bottom: 1.25rem;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid #334155;
      font-size: 0.85rem;
    }
    .prose th {
      background-color: #1E293B;
      color: #94A3B8;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.72rem;
      letter-spacing: 0.05em;
      padding: 11px 15px;
      border-bottom: 1px solid #334155;
      text-align: left;
    }
    .prose td {
      padding: 11px 15px;
      border-bottom: 1px solid #1E293B;
      color: #E2E8F0;
    }
    .prose tr:last-child td { border-bottom: none; }
    .prose tr:nth-child(even) td { background-color: #111827; }

    ::selection { background: #1D4ED8; color: #FFFFFF; }
    textarea { overscroll-behavior: contain; }
  </style>
</head>
<body class="overflow-hidden bg-[#090E17] text-[#F1F5F9]">
  <div id="root"></div>
  <script>
    window.addEventListener('error', function(e) {
      console.error('Global Error caught:', e);
      var root = document.getElementById('root');
      if (root && (!root.innerHTML || root.innerHTML.trim() === '')) {
        root.innerHTML = '<div style="padding: 40px; color: #F87171; font-family: sans-serif; text-align: center; max-width: 500px; margin: 100px auto; background: #0F172A; border: 1px solid #334155; border-radius: 20px;">' +
          '<h2 style="color: #F87171; font-size: 20px; font-weight: bold; margin-bottom: 12px;">Script Error</h2>' +
          '<p style="color: #94A3B8; font-size: 13px; line-height: 1.6; margin-bottom: 20px;">' + (e.message || 'Error executing client scripts') + '</p>' +
          '<button onclick="localStorage.clear(); sessionStorage.clear(); location.reload();" style="padding: 10px 20px; background: #2563EB; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 13px;">Clear Cache & Reload</button>' +
        '</div>';
      }
    });
  </script>
  <script type="module" src="/src/index.tsx"></script>
</body>
</html>
